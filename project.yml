name: PlanetDay
options:
  bundleIdPrefix: com.taylorburke
  deploymentTarget:
    watchOS: "10.0"
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: 5LB2Q93R38
    CODE_SIGN_STYLE: Automatic
targets:
  # Codeless iOS wrapper the App Store requires around a watch-only app (same shape
  # as Xcode's watch-only template). This is the target you archive and upload.
  PlanetDay:
    type: application.watchapp2-container
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taylorburke.PlanetDay
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Planet of the Day
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    dependencies:
      - target: PlanetDayWatch
  PlanetDayWatch:
    type: application
    platform: watchOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taylorburke.PlanetDay.watchkitapp
        PRODUCT_MODULE_NAME: PlanetDay
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKWatchOnly: YES
        INFOPLIST_KEY_CFBundleDisplayName: Planet of the Day
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: PlanetDayWidget
  PlanetDayWidget:
    type: app-extension
    platform: watchOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taylorburke.PlanetDay.watchkitapp.Widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Planet of the Day
    info:
      path: Widget/Info.plist
      properties:
        # Must match the app's versions or App Store Connect rejects the upload.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  PlanetDayTests:
    type: bundle.unit-test
    platform: watchOS
    sources: [Tests]
    dependencies:
      - target: PlanetDayWatch
schemes:
  PlanetDay:
    build:
      targets:
        PlanetDay: all
    archive:
      config: Release
  PlanetDayWatch:
    build:
      targets:
        PlanetDayWatch: all
    run:
      config: Debug
    test:
      targets: [PlanetDayTests]
